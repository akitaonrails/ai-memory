[package]
name = "ai-memory-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "LLM provider trait with typed Anthropic, OpenAI, Gemini, OpenAI OAuth, GitHub Copilot and OpenAI-compat clients."
# One integration-test binary instead of one per file. Each binary
# statically links the whole dep graph and gets scanned by macOS on
# first run.

[dependencies]
ai-memory-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
secrecy.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest.workspace = true
async-trait.workspace = true
regex.workspace = true
base64.workspace = true
uuid.workspace = true
jiff.workspace = true
sha2.workspace = true
# Local in-process embeddings (2.0 item 5): pure-Rust BERT inference,
# feature-gated so a slim build can drop the ML dependency tree.
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[features]
default = ["local-embeddings"]
local-embeddings = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]

[dev-dependencies]
tokio = { workspace = true }
tempfile.workspace = true
rstest.workspace = true
# In-process HTTP mock for the openai-compat strict-fallback tests.
# Scoped to dev-dependencies so production binaries don't pull it in.
wiremock = "0.6"

[lints]
workspace = true
