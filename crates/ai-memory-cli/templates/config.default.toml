# ai-memory configuration.
#
# All values can also be overridden via environment variables prefixed
# `AI_MEMORY_` (e.g. `AI_MEMORY_BIND=0.0.0.0:49374`).
#
# `data_dir` is intentionally absent here: it's set by `--data-dir`
# or `AI_MEMORY_DATA_DIR`, and the config file lives inside it.

# HTTP bind address used by `ai-memory serve`.
bind = "127.0.0.1:49374"

# Host-header allowlist for the HTTP server (DNS-rebinding defence).
# Keep loopback defaults for local-only use. When binding to a LAN
# address, include the host/IP clients will use, e.g.
# `AI_MEMORY_ALLOWED_HOSTS=homelab,192.168.0.90,localhost,127.0.0.1`.
allowed_hosts = ["localhost", "127.0.0.1", "::1"]

# Default tracing filter (overridable by RUST_LOG).
log_level = "info"

# Optional server-side hook ingest limiter for shared/remote installs. The rate
# is tokens per second per actor/session source; 0 or unset disables it. Burst
# defaults to the rate (minimum one token when enabled). Env equivalents:
# `AI_MEMORY_HOOK_RATE_PER_SEC` and `AI_MEMORY_HOOK_RATE_BURST`.
# hook_rate_per_sec = 0.0
# hook_rate_burst = 0.0

# Server-side half of the assistant/Stop capture opt-in (#196). When true, the
# server persists a Claude Code Stop event's final assistant turn (sanitized and
# capped at 2 KB) as the Stop body. OFF by default: assistant text is privacy-
# sensitive — it can quote code, secrets, or content from paths ai-memory never
# sees, and it flows into consolidation/reviewer prompts (and out to a cloud LLM
# provider if one is configured). This is a DOUBLE opt-in: the client must also
# be installed with `ai-memory install-hooks --agent claude-code
# --capture-assistant`. Env equivalent: `AI_MEMORY_CAPTURE_ASSISTANT=true`.
# capture_assistant = false

# Strip root-level anyOf/oneOf/allOf from MCP tool input schemas on every
# tools/list, even without a `?flavor=moonshot` / `?flavor=bedrock` marker.
# Generic MCP clients (OpenCode, Cursor) never send that marker yet forward
# schemas verbatim to strict upstreams that reject root combinators with a
# 400. Runtime "exactly one of" validation is unchanged. Env equivalent:
# `AI_MEMORY_STRIP_ROOT_COMBINATORS=true`.
# strip_root_combinators = false

# Serve MCP tool input schemas in the subset Google's Schema (Vertex/Gemini
# functionDeclaration.parameters) accepts: the nullable unions schemars emits
# for every optional tool argument (`"type": ["integer", "null"]`) collapse to a
# single type plus `nullable: true`. A client that forwards our schema verbatim
# to Vertex otherwise fails the whole session at tools/list with "specified
# other fields alongside any_of". Gemini CLI and Antigravity CLI normalize
# schemas client-side and need nothing; this is for pass-through clients such as
# OpenCode on a Gemini/Vertex model. Implies strip_root_combinators; runtime
# validation is unchanged. Per-client equivalent: append `?flavor=gemini` to the
# MCP URL. Env equivalent: `AI_MEMORY_GEMINI_SAFE_SCHEMAS=true`.
# gemini_safe_schemas = false

# Optional final LLM relevance pass for project/scopes memory_query calls.
# Requires an LLM provider and adds at most one provider call per eligible
# query. The bounded query, page titles, and search snippets are sent to that
# provider as JSON-encoded untrusted data. Any failed or invalid response keeps
# the normal ranking. Concurrent provider calls are capped at four; saturated
# queries keep local order. Env equivalent: `AI_MEMORY_RERANKER=llm`.
# reranker = "llm"

# M8 retention-sweep parameters.
#
# Formula:
#   retention = salience * exp(-lambda * age_days)
#             + sigma * log(1 + access_count) * exp(-mu * days_since_access)
#               * (1 + breadth_weight
#                    * ln(1 + max(distinct_actors - 1, 0)))
#
# With the defaults below, an unused episodic page drops below
# `cold_threshold = 0.20` at ~80 days; recent accesses bump it back up.
# Semantic / pinned pages are exempt from decay entirely. Tune to taste:
#
#   - Slow decay (forget less aggressively): lambda = 0.01 (~140d floor)
#   - Faster decay (clean up more aggressively): lambda = 0.04 (~40d floor)
#   - Bigger access boost (frequently-used stuff lasts longer): sigma = 1.0
#   - Bigger time-pressure on access: mu = 0.08
#   - Reward pages used by more identified operators: breadth_weight = 0.2
#
# Raw observations are the store's growth driver (a busy install can add
# gigabytes a year), while the durable value is the compiled pages. Set
# observation_retention_days to a positive number to let the sweep delete raw
# observations older than that — but ONLY for sessions already consolidated into
# a page that is still live. Unconsolidated sessions, and sessions whose page was
# evicted by decay, keep every row. 0 (the default) disables the pass entirely.
# Pruning is IRREVERSIBLE: observations are the input to consolidation, so a
# pruned session can never be re-consolidated (a better model, a better prompt,
# or a fixed consolidator bug make no difference) and its summary page becomes
# the only surviving account of that session. The 0 default is a contract: this
# pass never runs unless an operator sets a positive age here.
# SQLite does not return freed pages to the OS without VACUUM, so the .db file
# will not shrink after the first prune; the `ai-memory backup` tarball will.
#   - A quarter of raw capture: observation_retention_days = 90
#   - Smaller transactions on a slow disk: observation_prune_batch = 2000
[decay]
lambda = 0.02
sigma = 0.6
mu = 0.04
salience_default = 1.0
cold_threshold = 0.20
hard_delete_after_days = 180
breadth_weight = 0.0
observation_retention_days = 0     # 0 = never prune raw observations
observation_prune_batch = 5000     # rows per prune transaction

# Privacy strip.
#
# Built-in patterns ALWAYS run; they cover bearer tokens, vendor-prefixed
# API keys (sk-, sk_live_, ghp_, github_pat_, AKIA, AIza, xoxb/xoxp/xoxa/
# xapp, Slack-shaped tokens), JWTs, PEM-bracketed private keys,
# URL-embedded credentials (postgres://user:pass@host), the named env
# vars for every supported provider, the generic `*_(KEY|TOKEN|SECRET|
# PASSWORD|CREDENTIAL)=…` shape, and filesystem paths under ~/.ssh,
# ~/.aws, ~/.kube, ~/.config/gcloud, ~/.gnupg.
#
# Two optional fields tune the strip:
#
#   extra_patterns — additional regex patterns to redact. Compiled once
#                    at startup; an invalid regex aborts startup with a
#                    clear error.
#   allowlist      — substrings that should never be redacted, even if a
#                    pattern matches them. Useful when a project codename
#                    or stable identifier collides with the generic
#                    env-var catch-all.
#
# Examples (uncomment to use):
#
#   extra_patterns = [
#     # Internal project token format: PROJ-<32 hex chars>.
#     "PROJ-[0-9a-f]{32}",
#   ]
#   allowlist = [
#     # We don't want this public identifier redacted by the generic
#     # *_KEY catch-all even though it ends in "_KEY".
#     "PUBLIC_VERIFY_KEY",
#   ]
[sanitize]
extra_patterns = []
allowlist = []

# Optional per-operator memory slots. Enable only when HTTP requests carry
# consistent DB-user or trusted-proxy identities. Shared `_slots/<name>.md`
# pages remain project-wide; engine-written slots are placed under the
# operator's bounded namespace and only shared plus own slots are injected into
# that operator's session brief and consolidation prompt. Exact page reads and
# searches remain project-wide: this is context-injection isolation, not RBAC.
[slots]
per_user = false

# LLM consolidation prompt limits. These are approximate because tokenizers
# differ by provider and model. Their sum must fit the model's context window;
# leave additional headroom for tokenizer variance. Small local models must
# lower both values together. Startup minimums are 6000 input and 1000 output.
[consolidation]
max_input_tokens = 100000
max_output_tokens = 32000

# Auto-improvement reviewer.
#
# The background scheduler reviews newly-completed sessions in every project
# when an LLM provider is configured. Ticks are non-overlapping: long all-project
# review passes delay the next tick instead of starting another copy. Approval is
# a separate stage: by default proposals are staged for audit and immediately
# approved through the normal wiki write path. Set `require_approval = true` to
# keep scheduler and manual-run proposals pending until an admin runs
# `ai-memory pending-writes approve <id>`.
#
# Older configs may still contain an `[auto_improve] mode = ...` line. That key
# is ignored by current ai-memory and can be removed when convenient.
[auto_improve]
require_approval = false
min_observations = 8
min_session_duration_secs = 120
min_confidence = 0.75
max_input_tokens = 24000
max_proposals_per_run = 5
include_raw_fallback = false
proposal_actor = "auto_improve"
pending_path = "_pending/auto-improve"

# Optional executable evaluation gate for selected proposal targets. Disabled by
# default; operators supply the command and scoring policy. The command is run
# directly (not through a shell), split on whitespace, with JSON on stdin. Use a
# wrapper script for paths with spaces, custom environment, or multiple commands.
# It must print JSON such as { "score_before": 0.72, "score_after": 0.76, "passed": true }.
[auto_improve.eval]
enabled = false
command = ""
timeout_secs = 120
targets = ["_rules", "procedures"]
min_delta = 0.0

[auto_improve.scheduler]
enabled = true
interval_secs = 3600
max_sessions_per_tick = 1 # per project
min_session_age_secs = 600

# How a mid-session event is attributed when the agent's cwd has moved since
# the session started. Session-CREATING events always resolve from their own
# cwd, and a `.ai-memory.toml` marker naming a project always wins in both
# modes — a marker is a deliberate rescope, not drift.
#
#   follow-cwd  (default) Re-resolve every mid-session event from its own cwd.
#               A `cd` into a sibling checkout records those observations in
#               that checkout's project, splitting one session's raw record
#               across two projects.
#   sticky      Keep the session's project wherever the agent wanders. Matches
#               the one-session-one-project model the rest of the system uses
#               (`sessions.project_id` is single-valued, and consolidation
#               writes one page in the session's project). Recommended when
#               one agent session means one project.
[routing]
mid_session = "follow-cwd"

# NOTE: `[auth]` must remain the LAST section in this template.
# `ai-memory init` appends further `[auth]` keys (token_pepper, root_username,
# ...) as bare keys to the end of the rendered file, so any section added
# below would silently capture them.
# Browser session cookies are safe on plain loopback HTTP by default. For `/web`
# behind a trusted HTTPS-terminating reverse proxy, set this to true so browsers
# send the cookie only over HTTPS. Do not enable it for direct HTTP: browsers
# will not send a Secure cookie there.
[auth]
secure_cookie = false
