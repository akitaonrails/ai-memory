<script id="project-tabs-behavior">
(function(){
  var list=document.querySelector('[role="tablist"][data-project-tabs]'),tabs=Array.from(list.querySelectorAll('[role="tab"]'));
  var legacy={"agents":"agents","token-usage":"tokens","session-token-table":"sessions","knowledge":"knowledge","overview":"overview"};
  function show(tab,focus){
    tabs.forEach(function(item){
      var selected=item===tab,panel=document.getElementById(item.getAttribute("aria-controls"));
      item.setAttribute("aria-selected",String(selected));item.tabIndex=selected?0:-1;panel.hidden=!selected;
    });
    if(focus)tab.focus({preventScroll:true});
  }
  function restore(){
    var url=new URL(location.href),fragment="";
    try{fragment=decodeURIComponent(url.hash.slice(1));}catch(_){}
    var target=document.getElementById(fragment),panel=target&&target.closest('[role="tabpanel"]');
    var tab=tabs.find(function(item){return panel?item.getAttribute("aria-controls")===panel.id:item.dataset.projectTab===url.searchParams.get("tab");})||tabs[0];
    if(Object.prototype.hasOwnProperty.call(legacy,fragment)){
      tab=tabs.find(function(item){return item.dataset.projectTab===legacy[fragment];});
      url.searchParams.set("tab",tab.dataset.projectTab);url.hash="";history.replaceState(null,"",url);
    }
    var activePanel=document.activeElement.closest('[role="tabpanel"]');
    show(tab,!!activePanel&&activePanel.id!==tab.getAttribute("aria-controls"));
  }
  function select(tab){
    if(tab.href!==location.href)history.pushState(null,"",tab.href);
    show(tab,true);
  }
  tabs.forEach(function(tab,index){
    tab.addEventListener("click",function(event){
      if(event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
      event.preventDefault();select(tab);
    });
    tab.addEventListener("keydown",function(event){
      if(event.altKey||event.ctrlKey||event.metaKey)return;
      var next;
      if(event.key==="ArrowRight")next=(index+1)%tabs.length;
      else if(event.key==="ArrowLeft")next=(index+tabs.length-1)%tabs.length;
      else if(event.key==="Home")next=0;
      else if(event.key==="End")next=tabs.length-1;
      else if(event.key===" "){event.preventDefault();select(tab);return;}
      else return;
      event.preventDefault();select(tabs[next]);
    });
  });
  window.addEventListener("popstate",restore);
  window.addEventListener("hashchange",restore);
  window.addEventListener("pageshow",restore);
  restore();
})();
</script>
