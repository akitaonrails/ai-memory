name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Manual full run (macOS legs included) — dispatch on the
  # release-candidate SHA right before a release.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS catches stat / SELinux / case-sensitivity assumptions
        # that wouldn't show up on a Linux-only matrix. It costs most of
        # the wall clock, so during iteration only Linux runs; the macOS
        # leg joins on a `full-ci` PR label or a manual dispatch, and is
        # MANDATORY right before a release (see AGENTS.md).
        os: >-
          ${{ (github.event_name == 'workflow_dispatch' ||
               contains(github.event.pull_request.labels.*.name, 'full-ci'))
              && fromJSON('["ubuntu-latest", "macos-latest"]')
              || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # On macOS, rustls-tls-native-roots otherwise enumerates Keychain every
      # time a test process builds a reqwest client. Scope the PEM-bundle
      # shortcut to macOS CI instead of setting a repo-wide Cargo env var that
      # breaks other local platforms.
      - name: Use macOS PEM bundle
        if: matrix.os == 'macos-latest'
        run: echo "SSL_CERT_FILE=/etc/ssl/cert.pem" >> "$GITHUB_ENV"
      # Linux regenerates the web stylesheet from source, so a stale vendored
      # static/tailwind.css fails here instead of shipping.
      - name: Regenerate the Tailwind bundle
        if: matrix.os == 'ubuntu-latest'
        run: echo "TAILWIND_BUILD=1" >> "$GITHUB_ENV"
      - run: cargo test --workspace --all-targets
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Build the external lifecycle relay
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --locked --manifest-path companions/ai-memory-relay/Cargo.toml
      - name: External lifecycle delivery against the real server
        run: >
          uv run --no-project python tests/e2e/external_relay_smoke.py
          --ai-memory-bin "${{ github.workspace }}/target/debug/ai-memory"
          --relay-bin "${{ github.workspace }}/target/debug/ai-memory-relay"
      - name: Vendored tailwind.css is current
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- crates/ai-memory-web/static/tailwind.css

  # Native Windows *test* coverage lives in `.github/workflows/windows.yml`: it
  # runs nightly, on demand, and on any pull request carrying the `windows`
  # label. It was ~1000s here against ~250s for the
  # same tests on Linux, which meant every pull request waited roughly
  # seventeen minutes when every gating job below finishes in about eight —
  # and it was `continue-on-error`, so those extra minutes gated nothing.
  # Add the `windows` label to a pull request that touches path handling,
  # file locking, or git plumbing.
  #
  # `windows-cross` below is the cheap per-merge complement: it cross-*builds*
  # the Windows target from Linux, so a `#[cfg(windows)]` compile or link break
  # is caught in this ~8-minute gate instead of at release time. It does NOT run
  # tests — cross-compiling proves the code builds and links for Windows, not
  # that it behaves correctly there. Wine is deliberately not used to fake a
  # runtime: it cannot faithfully reproduce native PowerShell, NTFS
  # case-folding, Win32 file-locking/sharing-violation semantics, or verbatim
  # (`\\?\`) path handling — exactly the surface windows.yml (and the local
  # dockur VM loop, see docs/design-windows-ci.md) exist to validate.
  windows-cross:
    name: windows cross-build (msvc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin to 1.95 to match rust-toolchain.toml: that file overrides the
      # active toolchain inside the repo, so the MSVC target's std must be added
      # to 1.95 (not `stable`) or the cross-build fails with "can't find crate
      # for `core`".
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: "1.95"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: windows-cross
      # cargo-xwin drives clang-cl / lld-link against an auto-downloaded MSVC
      # CRT + Windows SDK, so bundled SQLite and vendored libgit2 (both C) build
      # for the target without a Windows host.
      - name: Install clang/lld toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm lld
      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked
      # --all-targets so the `#[cfg(windows)]` test binaries compile too — that
      # is the class of break (a test that only compiles on Windows) this gate
      # is here to catch before it reaches windows.yml or a release.
      - run: cargo xwin build --workspace --all-targets --target x86_64-pc-windows-msvc

  # Companions have their own workspaces and need separate checks.
  companions:
    name: companions (${{ matrix.companion }})
    strategy:
      fail-fast: false
      matrix:
        companion: [ai-memory-importer, ai-memory-relay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: companions/${{ matrix.companion }}
      - run: cargo fmt --check --manifest-path companions/${{ matrix.companion }}/Cargo.toml
      - run: cargo clippy --locked --manifest-path companions/${{ matrix.companion }}/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path companions/${{ matrix.companion }}/Cargo.toml

  # Build the release binary on its own so a release-only failure
  # (LTO crash, codegen issue, dead-code-with-debug-assertions) doesn't
  # ship to Docker Hub silently.
  release-build:
    name: cargo build --release (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Keep Linux on Debian bookworm so the prebuilt binary matches the
        # Docker runtime image. macOS entries mirror the release assets;
        # they run only on `full-ci` / dispatch (mandatory pre-release),
        # like the macOS test leg above.
        include: >-
          ${{ (github.event_name == 'workflow_dispatch' ||
               contains(github.event.pull_request.labels.*.name, 'full-ci'))
              && fromJSON('[{"artifact": "linux-x86_64", "runner": "ubuntu-22.04"},
                            {"artifact": "macos-aarch64", "runner": "macos-15"},
                            {"artifact": "macos-x86_64", "runner": "macos-15-intel"}]')
              || fromJSON('[{"artifact": "linux-x86_64", "runner": "ubuntu-22.04"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo build --release --bin ai-memory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-ai-memory-${{ matrix.artifact }}
          path: target/release/ai-memory

  # `cargo install --path` deliberately resolves without the workspace lockfile.
  # Keep that user-facing path visible alongside the normal lock-aware gates so
  # an allowed upstream dependency update cannot break source installation.
  source-install:
    name: cargo install --path (fresh resolution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install with a fresh dependency resolution
        run: cargo install --path crates/ai-memory-cli --debug --root target/source-install
      - name: Smoke test installed binary
        run: target/source-install/bin/ai-memory --version

  native-packaging:
    name: native packaging assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-native-packaging.sh
      - run: tests/wrapper_upgrade.sh

  # `tests/hooks/test_lib.sh` covers `hooks/_lib.sh`, the POSIX shell bundle —
  # the one shipped surface no Rust job reaches. Its own header says "POSIX
  # shell + sed/awk only, so no extra CI setup needed", and nothing was running
  # it: the suite appears only in AGENTS.md, as a manual shell-level check.
  #
  # The matrix is the substance here, not decoration. The bundle runs on
  # whatever awk the host provides, and the implementations disagree on exactly
  # what this code leans on: `ai_memory_json_string` builds its JSON escapes
  # out of gsub replacement strings, and `ai_memory_json_field` parses a spool
  # entry back out. A single-awk leg would say nothing about the hosts users
  # install on — macOS ships the one-true-awk lineage (`original-awk` here),
  # Debian and Ubuntu default to mawk, most other Linux to gawk.
  #
  # BusyBox awk is included now that #737 fixed the gsub-replacement escape bug
  # it exposed (#733) — it is the implementation on Alpine and many minimal
  # containers, so covering it is the point of this job, not an afterthought.
  hooks-shell:
    name: hook bundle (${{ matrix.awk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # BusyBox joined the matrix once #737 fixed the gsub-replacement escape
        # bug (#733): its awk is a distinct implementation the bundle runs on,
        # and it is invoked as the `awk` applet of the `busybox` binary rather
        # than a standalone `/usr/bin/busybox`, so the shim special-cases it.
        awk: [gawk, mawk, original-awk, busybox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A PATH shim rather than `update-alternatives`, so the leg is explicit
      # about which binary the suite gets and fails loudly if a package ever
      # stops shipping that path.
      - name: select ${{ matrix.awk }} as awk
        run: |
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/awk-shim"
          if [ '${{ matrix.awk }}' = busybox ]; then
            sudo apt-get install -y --no-install-recommends busybox
            test -x /usr/bin/busybox
            printf '#!/bin/sh\nexec /usr/bin/busybox awk "$@"\n' \
              > "$RUNNER_TEMP/awk-shim/awk"
          else
            sudo apt-get install -y --no-install-recommends '${{ matrix.awk }}'
            test -x '/usr/bin/${{ matrix.awk }}'
            printf '#!/bin/sh\nexec /usr/bin/%s "$@"\n' '${{ matrix.awk }}' \
              > "$RUNNER_TEMP/awk-shim/awk"
          fi
          chmod +x "$RUNNER_TEMP/awk-shim/awk"
          echo "$RUNNER_TEMP/awk-shim" >> "$GITHUB_PATH"
      - name: awk in use
        run: awk --version 2>&1 | head -n 1 || true
      - run: sh tests/hooks/test_lib.sh

  # `bin/release` copies `## [Unreleased]` into the new version section
  # verbatim, so a repeated `### ` heading there ships release notes with the
  # entries split across two identical headings. Valid Markdown, invisible in
  # review, and it has happened repeatedly.
  changelog:
    name: changelog sections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check-changelog-frozen.sh` diffs against the merge base, so it
          # needs history rather than a shallow clone.
          fetch-depth: 0
      - run: scripts/check-changelog-sections.sh
      - name: released sections stay frozen
        run: scripts/check-changelog-frozen.sh "origin/${{ github.base_ref || github.event.repository.default_branch }}"

  # End-to-end docker smoke: packages the release-build binary and confirms
  # the image runs. Catches Dockerfile drift (missing COPY, bad ENTRYPOINT)
  # before it lands in production without recompiling Rust in Docker.
  docker-smoke:
    name: docker image smoke
    runs-on: ubuntu-latest
    needs: release-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-ai-memory-linux-x86_64
          path: dist/docker/ai-memory-linux-x86_64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: build image (local tag only)
        run: docker build --target runtime-prebuilt-amd64 -f docker/Dockerfile -t ai-memory:ci .
      - name: --version smoke
        run: docker run --rm ai-memory:ci --version
      - name: bundled hooks present
        run: docker run --rm --entrypoint sh ai-memory:ci -c "ls /usr/local/share/ai-memory/hooks/"
      - name: --help lists the v0.3 subcommands
        run: |
          out=$(docker run --rm ai-memory:ci --help)
          for sub in bootstrap install-mcp install-hooks setup-agent generate-auth-token; do
              echo "$out" | grep -q "$sub" || { echo "missing subcommand: $sub"; exit 1; }
          done

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          log-level: warn
          command: check
          arguments: --all-features
      - name: Relay dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          log-level: warn
          command: check
          manifest-path: companions/ai-memory-relay/Cargo.toml
          arguments: --all-features

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo install cargo-audit --locked
      - run: >
          cargo audit
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2024-0320
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
      - run: cargo audit --file companions/ai-memory-relay/Cargo.lock

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action scans the pushed/PR commit range. Full history is
          # checked separately by secret-scan.yml on a schedule or on demand.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Exit nonzero if any secret is found; config lives at the
          # repo root so the same rules apply locally if you also
          # install gitleaks.
          GITLEAKS_CONFIG: .gitleaks.toml
