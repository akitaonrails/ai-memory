[workspace]

[package]
name = "ai-memory-importer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
ai-memory-client = { version = "0.1.0", path = "../ai-memory-client" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
htmlize = { version = "1.1", features = ["unescape"] }
# Pure-Rust text-layer extraction. It does not OCR scanned/image-only PDFs.
lopdf = { version = "0.45", default-features = false }
quick-xml = "0.42"
libc = "0.2"
# Native roots, matching the workspace: the importer POSTs to the same server
# an operator may front with a private CA (#492).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.37", features = ["backup", "bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
url = "2"
# Stable ingest keys for agentmemory records (UUIDv5 of their ids).
uuid = { version = "1", features = ["v5"] }
walkdir = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
