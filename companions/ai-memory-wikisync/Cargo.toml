[workspace]

[package]
name = "ai-memory-wikisync"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
# Native roots, matching the workspace: the export reads from the same server
# an operator may front with a private CA (#492).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Unpredictable, exclusively created staging files for every atomic replace
# (GHSA-jr85-7366-xrm2); the tests also use it for temp destinations.
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net"] }
